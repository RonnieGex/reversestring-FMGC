<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse String</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --surface-muted: #fbfbfa;
            --text: #191919;
            --text-soft: #6b6b6b;
            --border: #e6e6e3;
            --border-strong: #d8d8d4;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --focus: #2f2f2f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            display: grid;
            place-items: center;
            padding: 32px 20px;
        }

        .app {
            width: 100%;
            max-width: 720px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 10px;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 1;
            color: var(--text-soft);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 2.5vw, 2.4rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 24px;
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-soft);
        }

        .field-group {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text);
        }

        input[type="text"] {
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            font-size: 1rem;
            line-height: 1.4;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        input[type="text"]::placeholder {
            color: #9a9a97;
        }

        input[type="text"]:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(24, 24, 24, 0.06);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            appearance: none;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: var(--radius-sm);
            min-height: 42px;
            padding: 0 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background-color 0.12s ease;
        }

        button:hover {
            border-color: var(--border-strong);
            background: #fcfcfb;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(24, 24, 24, 0.08);
        }

        .button-primary {
            background: #191919;
            color: #ffffff;
            border-color: #191919;
        }

        .button-primary:hover {
            background: #111111;
            border-color: #111111;
        }

        .button-hidden {
            display: none;
        }

        .result-card {
            border: 1px solid var(--border);
            background: var(--surface-muted);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .result-title {
            margin: 0;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-soft);
        }

        .status {
            margin: 0;
            font-size: 0.84rem;
            color: var(--text-soft);
            min-height: 1.2em;
            text-align: right;
        }

        .result-output {
            margin: 0;
            min-height: 72px;
            padding: 14px;
            border-radius: var(--radius-sm);
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .placeholder {
            color: #9a9a97;
        }

        @media (max-width: 640px) {
            .app {
                padding: 22px;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .status {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <main class="app" aria-label="Reverse String application">
        <p class="eyebrow">Utility</p>
        <h1>Reverse String</h1>
        <p class="subtitle">Type any word or sentence and see the reversed output instantly.</p>

        <section class="field-group" aria-labelledby="input-label">
            <label id="input-label" for="textInput">Enter text</label>
            <input id="textInput" type="text" placeholder="Type something like AI4Devs" autocomplete="off"
                spellcheck="false" aria-describedby="resultText" />
        </section>

        <div class="actions">
            <button id="reverseButton" class="button-primary button-hidden" type="button">
                Reverse
            </button>
            <button id="copyButton" type="button">
                Copy
            </button>
        </div>

        <section class="result-card" aria-live="polite">
            <div class="result-header">
                <h2 class="result-title">Reversed output</h2>
                <p id="statusMessage" class="status" aria-live="polite"></p>
            </div>
            <p id="resultText" class="result-output">
                <span class="placeholder">Your reversed text will appear here.</span>
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
